<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AI動画クリエイター。テキストや画像から動画を作るための生成AIスタジオ。">
<title>AI動画クリエイター｜生成AIスタジオ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#0b1020;color:#f5f7ff}
header{padding:22px 18px;background:linear-gradient(135deg,#151d3b,#251447);border-bottom:1px solid #30395f}
h1{margin:0;font-size:25px}header p{margin:7px 0 0;color:#bfc7e6}
main{max-width:900px;margin:auto;padding:18px}.card{background:#121a31;border:1px solid #2c365c;border-radius:18px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:700;margin:12px 0 7px}textarea,input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #3b4771;background:#0b1124;color:#fff;font:inherit}
textarea{min-height:150px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
button{border:0;border-radius:12px;padding:13px 16px;background:#5b63ff;color:#fff;font-weight:800;cursor:pointer;margin-top:12px}
button.secondary{background:#273153}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:8px 11px;border-radius:999px;background:#222c4d;cursor:pointer}
#status{margin-top:12px;color:#c9d1ff}.preview{min-height:180px;border:1px dashed #56638e;border-radius:14px;display:grid;place-items:center;color:#aab4d8;text-align:center;padding:20px}
.small{font-size:13px;color:#aeb8d8;line-height:1.6}.warn{color:#ffd38a}
@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>
<header><h1>🎬 AI動画クリエイター</h1><p>生成AI動画スタジオ</p></header>
<main>
<section class="card">
<h2>✨ 動画を作る</h2>
<label for="prompt">プロンプト</label>
<textarea id="prompt" placeholder="例：雨上がりの街を映画のような実写風映像で撮影。水たまりに街灯が反射し、カメラがゆっくり前進する。"></textarea>
<div class="chips">
<span class="chip" onclick="add('実写映画風')">実写映画風</span>
<span class="chip" onclick="add('オリジナルアニメ風')">オリジナルアニメ風</span>
<span class="chip" onclick="add('自然な人物動作')">自然な人物動作</span>
<span class="chip" onclick="add('リアルな物理表現')">物理表現</span>
</div>
<div class="grid">
<div><label>生成方式</label><select id="mode"><option>テキスト → 動画</option><option>画像 → 動画</option></select></div>
<div><label>画面比率</label><select><option>16:9</option><option>9:16</option><option>1:1</option></select></div>
</div>
<button onclick="generate()">🚀 生成設定を作成</button><div id="status"></div>
</section>
<section class="card">
<h2>🖼️ 画像 → 動画</h2>
<input id="file" type="file" accept="image/*">
<div class="preview" id="preview">画像を選択するとプレビューされます</div>
</section>
<section class="card">
<h2>🧠 AIプロンプト補助</h2>
<button class="secondary" onclick="improve()">プロンプトを整理</button>
<p class="small">カメラ、照明、動作、環境、物理表現などを整理します。</p>
</section>
<section class="card">
<h2>⚙️ 生成エンジン接続口</h2>
<p class="small">この版はWebアプリのUI試作です。実際の動画生成にはGPU上の生成モデルをサーバー側へ接続します。</p>
</section>
</main>
<script>
const p=document.getElementById('prompt');
function add(t){p.value+=(p.value?'、':'')+t}
function generate(){
 const s=document.getElementById('status');
 s.textContent=p.value.trim()?'✅ 生成設定を作成しました。生成エンジン接続待ちです。':'プロンプトを入力してください。';
}
function improve(){
 if(!p.value.trim())p.value='映画的な実写風映像。自然な人物動作、現実的な光と影、物理法則に沿った動き、滑らかなカメラワーク。';
 else p.value='映画的な映像。'+p.value+'。自然な動作、現実的な光と影、物理法則に沿った動き、滑らかなカメラワーク。';
}
document.getElementById('file').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const url=URL.createObjectURL(f);
 document.getElementById('preview').innerHTML='<img src="'+url+'" style="max-width:100%;max-height:320px;border-radius:10px" alt="選択画像">';
});
</script>
</body>
</html>
